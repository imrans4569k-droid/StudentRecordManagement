<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Management System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #102a43, #2563a6);
        }

        .navbar-brand {
            font-weight: bold;
            color: white;
        }

        .main-title {
            color: #163b65;
            font-weight: 700;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            background-color: white;
            border-bottom: 1px solid #edf0f4;
            padding: 18px;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #2563a6;
            border-color: #2563a6;
        }

        .btn-primary:hover {
            background-color: #194b81;
        }

        .table thead th {
            background-color: #edf4fc;
            color: #163b65;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .form-control,
        .form-select {
            padding: 10px;
        }

        .footer {
            color: #6c757d;
            font-size: 13px;
        }

        @media (max-width: 576px) {
            .main-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand">
                🎓 Student Management System
            </span>
        </div>
    </nav>

    <main class="container py-4">

        <!-- Page Heading -->
        <div class="mb-4">
            <h2 class="main-title">Student Records</h2>

            <p class="text-secondary mb-0">
                Add, view, search, update, and manage student information.
            </p>
        </div>

        <!-- Notification Message -->
        <div
            id="notice"
            class="alert d-none"
            role="alert"
        ></div>

        <!-- Student Form -->
        <div class="card mb-4">

            <div class="card-header">
                <span id="formTitle">Add New Student</span>
            </div>

            <div class="card-body p-4">

                <form id="studentForm">

                    <div class="row g-3">

                        <!-- Student Name -->
                        <div class="col-md-6">
                            <label class="form-label" for="name">
                                Full Name *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Enter student name"
                                maxlength="100"
                                required
                            >
                        </div>

                        <!-- Roll Number -->
                        <div class="col-md-6">
                            <label class="form-label" for="roll">
                                Roll Number *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="roll"
                                name="roll"
                                placeholder="Enter roll number"
                                maxlength="40"
                                required
                            >
                        </div>

                        <!-- Department -->
                        <div class="col-md-6">
                            <label class="form-label" for="department">
                                Department
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="department"
                                name="department"
                                placeholder="Example: CSE (AI & ML)"
                                maxlength="100"
                            >
                        </div>

                        <!-- Academic Year -->
                        <div class="col-md-6">
                            <label class="form-label" for="year">
                                Academic Year
                            </label>

                            <select
                                class="form-select"
                                id="year"
                                name="year"
                            >
                                <option value="">Select year</option>
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year</option>
                                <option value="3rd Year">3rd Year</option>
                                <option value="4th Year">4th Year</option>
                            </select>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label class="form-label" for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="student@example.com"
                                maxlength="150"
                            >
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                            <label class="form-label" for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                placeholder="Enter phone number"
                                maxlength="25"
                            >
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary px-4"
                            id="submitBtn"
                        >
                            Add Student
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary ms-2 d-none"
                            id="cancelBtn"
                        >
                            Cancel Edit
                        </button>

                        <button
                            type="reset"
                            class="btn btn-light border ms-2"
                        >
                            Clear
                        </button>

                    </div>

                </form>

            </div>
        </div>

        <!-- Student Records Table -->
        <div class="card">

            <div class="card-header d-flex justify-content-between
                        align-items-center flex-wrap gap-2">

                <span>Registered Students</span>

                <span
                    class="badge text-bg-primary"
                    id="studentCount"
                >
                    0 Students
                </span>

            </div>

            <div class="card-body p-3">

                <!-- Search -->
                <div class="mb-3">

                    <input
                        type="search"
                        class="form-control"
                        id="search"
                        placeholder="Search by name, roll number, department, or email..."
                    >

                </div>

                <!-- Table -->
                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>
                            <tr>
                                <th>Roll Number</th>
                                <th>Student Name</th>
                                <th>Department</th>
                                <th>Year</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="studentRows">

                            <tr>
                                <td colspan="7" class="text-center py-4">
                                    Loading student records...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

        <p class="text-center footer mt-4">
            Student Record Management System | Java Backend
        </p>

    </main>

    <script>
        const form = document.getElementById("studentForm");
        const studentRows = document.getElementById("studentRows");
        const searchInput = document.getElementById("search");
        const studentCount = document.getElementById("studentCount");
        const notice = document.getElementById("notice");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const formTitle = document.getElementById("formTitle");

        let students = [];
        let editingId = null;
        let noticeTimer;

        // Display application messages.
        function showMessage(message, type = "success") {
            clearTimeout(noticeTimer);

            notice.className = "alert alert-" + type;
            notice.textContent = message;

            noticeTimer = setTimeout(() => {
                notice.classList.add("d-none");
            }, 4000);
        }

        // Prevent entered text from being interpreted as HTML.
        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        // Make a request to the Java backend.
        async function apiRequest(url, options = {}) {
            const response = await fetch(url, options);

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error("The server returned an invalid response.");
            }

            if (!response.ok) {
                throw new Error(data.error || "The operation failed.");
            }

            return data;
        }

        // Load all student records from Java.
        async function loadStudents() {
            try {
                students = await apiRequest("/api/students");
                renderStudents();
            } catch (error) {
                studentRows.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger py-4">
                            Could not load records. Check whether the Java
                            server is running.
                        </td>
                    </tr>
                `;

                studentCount.textContent = "0 Students";
                showMessage(error.message, "danger");
            }
        }

        // Display student records in the table.
        function renderStudents() {
            const query = searchInput.value.trim().toLowerCase();

            const filteredStudents = students.filter(student => {
                const searchableText = [
                    student.name,
                    student.roll,
                    student.department,
                    student.year,
                    student.email,
                    student.phone
                ].join(" ").toLowerCase();

                return searchableText.includes(query);
            });

            studentCount.textContent =
                filteredStudents.length +
                (filteredStudents.length === 1 ? " Student" : " Students");

            if (filteredStudents.length === 0) {
                studentRows.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-secondary py-4">
                            No student records found.
                        </td>
                    </tr>
                `;

                return;
            }

            studentRows.innerHTML = filteredStudents.map(student => `
                <tr>
                    <td>${escapeHtml(student.roll)}</td>

                    <td class="fw-semibold">
                        ${escapeHtml(student.name)}
                    </td>

                    <td>${escapeHtml(student.department || "-")}</td>

                    <td>${escapeHtml(student.year || "-")}</td>

                    <td>${escapeHtml(student.email || "-")}</td>

                    <td>${escapeHtml(student.phone || "-")}</td>

                    <td class="text-nowrap">
                        <button
                            type="button"
                            class="btn btn-sm btn-outline-primary me-1"
                            onclick="editStudent(${student.id})"
                        >
                            Edit
                        </button>

                        <button
                            type="button"
                            class="btn btn-sm btn-outline-danger"
                            onclick="deleteStudent(${student.id})"
                        >
                            Delete
                        </button>
                    </td>
                </tr>
            `).join("");
        }

        // Add a new student or update an existing student.
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const studentData = new URLSearchParams(
                new FormData(form)
            );

            const isEditing = editingId !== null;

            const url = isEditing
                ? "/api/students?id=" + editingId
                : "/api/students";

            try {
                await apiRequest(url, {
                    method: isEditing ? "PUT" : "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded;charset=UTF-8"
                    },

                    body: studentData
                });

                resetForm();

                showMessage(
                    isEditing
                        ? "Student record updated successfully."
                        : "Student added successfully."
                );

                await loadStudents();

            } catch (error) {
                showMessage(error.message, "danger");
            }
        });

        // Put a student's information back into the form for editing.
        window.editStudent = function(id) {
            const student = students.find(item => item.id === id);

            if (!student) {
                showMessage("Student record not found.", "danger");
                return;
            }

            form.elements.namedItem("name").value = student.name;
            form.elements.namedItem("roll").value = student.roll;
            form.elements.namedItem("department").value =
                student.department;
            form.elements.namedItem("year").value = student.year;
            form.elements.namedItem("email").value = student.email;
            form.elements.namedItem("phone").value = student.phone;

            editingId = id;

            formTitle.textContent = "Edit Student";
            submitBtn.textContent = "Update Student";
            cancelBtn.classList.remove("d-none");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        };

        // Delete a student record.
        window.deleteStudent = async function(id) {
            const student = students.find(item => item.id === id);

            if (!student) {
                showMessage("Student record not found.", "danger");
                return;
            }

            const confirmed = confirm(
                "Delete the record for " + student.name + "?"
            );

            if (!confirmed) {
                return;
            }

            try {
                await apiRequest("/api/students?id=" + id, {
                    method: "DELETE"
                });

                if (editingId === id) {
                    resetForm();
                }

                showMessage("Student record deleted successfully.");

                await loadStudents();

            } catch (error) {
                showMessage(error.message, "danger");
            }
        };

        // Cancel editing and return to the Add Student form.
        function resetForm() {
            form.reset();

            editingId = null;

            formTitle.textContent = "Add New Student";
            submitBtn.textContent = "Add Student";

            cancelBtn.classList.add("d-none");
        }

        cancelBtn.addEventListener("click", resetForm);

        // Clear also exits editing mode.
        form.addEventListener("reset", function() {
            editingId = null;
            formTitle.textContent = "Add New Student";
            submitBtn.textContent = "Add Student";
            cancelBtn.classList.add("d-none");
        });

        // Filter records as the user types.
        searchInput.addEventListener("input", renderStudents);

        // Load saved records when the page opens.
        loadStudents();
    </script>

</body>
</html>
